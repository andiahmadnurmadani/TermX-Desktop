name: Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # Apple silicon
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - os: macos-15-intel      # Intel
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            args: ""
            target: ""
          - os: windows-latest
            args: ""
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
      - run: npm ci || npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: TermX ${{ github.ref_name }}
          releaseBody: See the README for install notes. Builds are not code-signed; installed apps update themselves from here.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: false

  # One job writes latest.json after every platform has uploaded, so parallel jobs can't drop entries.
  updater-json:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Build latest.json from the release's .sig assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir sigs && cd sigs
          gh release download "$TAG" -R "$REPO" -p '*.sig'
          python3 - <<'PY'
          import glob, json, os, datetime
          tag = os.environ["TAG"]; repo = os.environ["REPO"]
          base = f"https://github.com/{repo}/releases/download/{tag}/"
          kinds = [  # (file suffix, platform keys)
              ("_aarch64.app.tar.gz", ["darwin-aarch64", "darwin-aarch64-app"]),
              ("_x64.app.tar.gz", ["darwin-x86_64", "darwin-x86_64-app"]),
              ("_amd64.AppImage", ["linux-x86_64", "linux-x86_64-appimage"]),
              ("_amd64.deb", ["linux-x86_64-deb"]),
              (".x86_64.rpm", ["linux-x86_64-rpm"]),
              ("_x64-setup.exe", ["windows-x86_64", "windows-x86_64-nsis"]),
              ("_x64_en-US.msi", ["windows-x86_64-msi"]),
          ]
          platforms = {}
          for sig in sorted(glob.glob("*.sig")):
              name = sig[:-4]
              for suffix, keys in kinds:
                  if name.endswith(suffix):
                      entry = {"signature": open(sig).read().strip(), "url": base + name}
                      for k in keys: platforms[k] = entry
          doc = {"version": tag.lstrip("v"), "notes": f"TermX {tag}",
                 "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                 "platforms": platforms}
          json.dump(doc, open("latest.json", "w"), indent=2)
          print(sorted(platforms))
          PY
          gh release upload "$TAG" latest.json --clobber -R "$REPO"
