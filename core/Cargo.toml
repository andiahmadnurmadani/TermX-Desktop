[package]
name = "termx-core"
version = "1.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
rand = "0.8"
aes-gcm = "0.10"
sha2 = "0.10"
async-trait = "0.1"
dirs = "5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
russh = "0.64.1"
russh-sftp = "3.0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
zeroize = "1"
tokio-util = "0.7"
ssh-key = { version = "=0.7.0-rc.11", features = ["getrandom", "rsa", "ed25519", "rand_core"] }
